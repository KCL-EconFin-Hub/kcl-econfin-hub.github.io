# Hub events. Order here does not matter — events are sorted by date.
#
# Required: title
# Optional:
#   type              e.g. "Seminar", "Workshop", "Reading group" (shown as a badge)
#   speaker           shown in bold
#   date              "YYYY-MM-DD", in quotes
#   end_date          "YYYY-MM-DD", for events spanning several days
#   time              "HH:MM-HH:MM" (or just "HH:MM" for a one-hour slot)
#   location
#   description       supports markdown
#   url               event page
#   registration_url
#   video_link        Teams/Zoom link
#   speaker_url
#   paper_url
#
# Events that have not finished yet (date or end_date today or later) appear
# under "Upcoming", soonest first; the rest under "Past", most recent first.
# An event with no date counts as upcoming and is listed last.
#
# The [] below is an empty list and keeps the file valid while there are no
# events. Delete it when you add the first real entry.

[]

