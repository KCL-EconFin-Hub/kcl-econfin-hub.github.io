# ---------------------------------------------------------------------------
# People shown on the site:
#
#   leads     the co-champions, shown in the sidebar of every page
#   members   everyone else
#
# The People section at the bottom of the overview lists leads and members
# together, sorted by last name, so list each person only once.
#
# Fields:
#   name        required
#   photo       optional; a square image in assets/img/people/ (shown as a
#               circle; 320x320 pixels is plenty)
#   job_title   optional
#   website     optional; the name links here (e.g. a KCL profile page)
#   sort_as     optional; what to sort by when the last word of the name
#               isn't the surname, e.g. "Gonzalez Amador"
# ---------------------------------------------------------------------------

